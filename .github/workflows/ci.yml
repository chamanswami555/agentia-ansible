name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        ansible_core: ["2.17", "2.18"]
    name: check (ansible-core ${{ matrix.ansible_core }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - name: Install the development environment
        run: make setup ANSIBLE_CORE=${{ matrix.ansible_core }}

      - name: Lint, unit tests and module documentation
        run: make check

      - name: ansible-test sanity
        run: make sanity

      - name: ansible-test integration
        run: make integration

      - name: Offline demo against the fake Agentia CLI
        run: bash tools/demo/offline-demo.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Offline rulebook demo (failed job to remediation playbook)
        run: bash tools/demo/offline-rulebook-demo.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: MCP server tests (including the release window in demo mode)
        run: cd mcp && npm ci && npm test

      - name: Agentia plugin tests
        run: cd plugin && npm ci && npm test

      - name: Keep the demo evidence
        uses: actions/upload-artifact@v4
        with:
          name: offline-demo-evidence-ansible-core-${{ matrix.ansible_core }}
          path: var/demo/**/*.json
          if-no-files-found: error
